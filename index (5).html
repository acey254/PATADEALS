<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pata Deals Hub</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--tx:#111;--mu:#5f5a52;--ac:#bb0000;--ac2:#fff;--gr:#006600;--bd:#e6dfd2;--warn:#b45309;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a1a;--tx:#f4f1ea;--mu:#a8a39a;--ac:#d62828;--ac2:#fff;--gr:#2fb457;--bd:#333;--warn:#f0a94a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.flag{height:14px;background:linear-gradient(#000 0 28%,#fff 28% 33%,#bb0000 33% 67%,#fff 67% 72%,#006600 72%)}header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#000;color:#fff}header svg{flex:none}h1{margin:0;font-size:22px;color:#fff}h1 span{color:#ff4d4d}
.sub{color:#d8d4cc;font-size:13px;margin:2px 0 0}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on,.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
main{padding:8px 16px 110px;max-width:720px;margin:auto}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-top:4px}
label{display:block;margin-top:12px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:14px;overflow:hidden;cursor:pointer}
.img{height:90px;display:grid;place-items:center;font-size:44px;background:var(--bd)}
.cb{padding:10px}.t{font-weight:600;font-size:14px}.p{color:var(--gr);font-weight:700;margin-top:2px}
.m{color:var(--mu);font-size:12px;margin-top:2px}
.btn{display:block;width:100%;text-align:center;border:0;background:var(--ac);color:var(--ac2);padding:13px;border-radius:12px;font:600 16px inherit;margin-top:14px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}
.fee{font-size:20px;font-weight:700;color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-right:4px}
.tag.ok{color:var(--gr);border-color:var(--gr)}
.tip{font-size:13px;color:var(--mu);margin-top:10px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.stat{font-size:28px;font-weight:700}

/* ---- app feel ---- */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
main>*{animation:up .35s ease both}
.grid .card{animation:up .45s ease both}
.grid .card:nth-child(2){animation-delay:.05s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.15s}.grid .card:nth-child(n+5){animation-delay:.2s}
.btn,.card,.chip,#tabbar button{transition:transform .15s ease,background .2s,opacity .2s}
.btn:active,.card:active,.chip:active{transform:scale(.97)}
.sk{border-radius:14px;background:linear-gradient(90deg,var(--bd) 25%,var(--card) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.img{height:auto!important;aspect-ratio:4/3;font-size:0!important;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:38px;font-weight:700;color:var(--mu);opacity:.5}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;width:100%}
.oth{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:8px;display:block}
.gold{color:#e6a817}
.th{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.th div{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;animation:up .3s ease both}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.up{display:block;text-align:center;border:2px dashed var(--bd);border-radius:12px;padding:16px;color:var(--tx);font-weight:600;cursor:pointer}
.up input{display:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 0;cursor:pointer;position:relative}
#tabbar button.on{color:var(--ac)}
#tabbar button.on::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--ac);animation:up .25s ease}
#tabbar button.fab svg{background:var(--ac);color:#fff;border-radius:50%;padding:9px;width:44px;height:44px;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#tabbar button.fab.on::before{display:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#111;color:#fff;padding:12px 18px;border-radius:12px;max-width:90%;font-size:14px;transition:.3s;z-index:60;pointer-events:none;border:1px solid #333}
#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:40;visibility:hidden}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:.25s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(90px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s ease}
#sheet.open{visibility:visible}#sheet.open .bk{opacity:1}#sheet.open .pn{transform:none}
#sheet .pn button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font-size:17px;padding:15px 6px;border-bottom:1px solid var(--bd)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bd{position:absolute;top:0;right:22%;background:var(--ac);color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px}
label.ck input{width:auto;margin:0}
</style>
</head>
<body>
<div class="flag"></div><header><svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><ellipse cx="17" cy="22" rx="14" ry="20" fill="#bb0000" stroke="#fff" stroke-width="2"/><ellipse cx="17" cy="22" rx="5" ry="12" fill="#000" stroke="#fff" stroke-width="1.5"/><path d="M17 -2v48" stroke="#fff" stroke-width="2"/></svg><div><h1>Pata Deals <span>Hub</span></h1><p class="sub">Bei poa, mali safi.</p></div></header>
<div id="tabbar"></div><div id="sheet"></div><div id="toast"></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1) PASTE YOUR TWO SUPABASE VALUES HERE (Project Settings > API)
const SUPABASE_URL="https://wvvymlaqirwlyompwbpg.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2dnltbGFxaXJ3bHlvbXB3YnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNTQ0MTUsImV4cCI6MjEwNzYzMDQxNX0.q50KHd3doDPyURt9E-RU6JSXCrTCqh27mVjR4O1FO5k";

const CATS={Electronics:500,Phones:500,Fashion:200,Furniture:300,Vehicles:1000,Books:100,Other:150};
const EMO={Electronics:"💻",Phones:"📱",Fashion:"👗",Furniture:"🛋️",Vehicles:"🚗",Books:"📚",Other:"📦"};
const NEEDID=["Phones","Electronics","Vehicles"];
const LABEL={requested:"Order placed",sold:"Sold, waiting for buyer to confirm",received:"Completed"};
let sb,U=null,P=null,tab="browse",view=null,mode="in",who="buyer",cat="All",q="",L=[],ST={},BS={},SP={lat:null,lng:null},ADM="reports",SPL=[],SQ="",SCN="Kenya",STW="All";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kes=n=>"KES "+Number(n).toLocaleString();
const stars=(a,n)=>n?`<span class="gold">★</span> ${a} (${n} ratings)`:"New seller";

async function init(){
  if(SUPABASE_URL.startsWith("PASTE")){$("app").innerHTML='<div class="box">Open index.html and paste your Supabase URL and key at the top.</div>';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await sb.auth.getSession();await setUser(data.session?.user);
}
async function setUser(u){U=u||null;P=null;tab="browse";view=null;
  if(U){const {data}=await sb.from("profiles").select("*").eq("id",U.id).single();P=data;}
  render();}
function nav(){}
async function render(){
  nav();const a=$("app");
  if(!U){a.innerHTML=authView();return;}
  if(!P){a.innerHTML='<div class="empty">Loading your account…</div>';return;}
  if(P.suspended){a.innerHTML='<div class="box"><b>Your account is suspended.</b><div class="tip">Please contact support to appeal.</div></div>';return;}
  a.innerHTML='<div class="sk" style="height:150px"></div><div class="sk" style="height:150px;margin-top:12px"></div><div class="sk" style="height:150px;margin-top:12px"></div>';
  a.innerHTML=view?await itemView(view):await ({browse,post,sales,items,cart,spot,spots,check,admin}[tab])();}

/* ---------- sign in / sign up ---------- */
function authView(){return `<h2>${mode==="in"?"Sign in":"Create your account"}</h2>`+
 (mode==="up"?`<div class="chips"><button class="chip ${who==="buyer"?"on":""}" onclick="who='buyer';render()">I want to buy</button><button class="chip ${who==="seller"?"on":""}" onclick="who='seller';render()">I want to sell</button></div><label>Full name<input id="a_name"></label><label>Phone (254…)<input id="a_phone" type="tel"></label>`:"")+
 `<label>Email<input id="a_email" type="email"></label><label>Password (6+ characters)<input id="a_pass" type="password"></label>
 <button class="btn" onclick="auth()">${mode==="in"?"Sign in":"Sign up"}</button>
 <button class="btn alt" onclick="mode='${mode==="in"?"up":"in"}';render()">${mode==="in"?"New here? Create account":"Have an account? Sign in"}</button>`;}
async function auth(){
  const email=$("a_email").value.trim(),password=$("a_pass").value;let r;
  if(mode==="up"){const name=$("a_name").value.trim(),phone=$("a_phone").value.trim();
    if(!name||!/^254\d{9}$/.test(phone)){toast("Enter your name and a phone like 254712345678.");return;}
    const f=await sb.functions.invoke("bright-service",{body:{email,password,name,phone,role:who}});
    if(f.error){let m="Sign up failed. Please try again.";try{m=(await f.error.context.json()).error||m}catch(_){}toast(m);return;}
    r=await sb.auth.signInWithPassword({email,password});}
  else r=await sb.auth.signInWithPassword({email,password});
  if(r.error){toast(r.error.message);return;}
  if(!r.data.session){toast("Check your email to confirm your account, then sign in.");return;}
  await setUser(r.data.user);}
async function logout(){await sb.auth.signOut();await setUser(null);}

/* ---------- browse + item page ---------- */
async function browse(){
  const [l,s]=await Promise.all([sb.from("listings_public").select("*").order("created_at",{ascending:false}),sb.from("seller_stats").select("*")]);
  L=l.data||[];ST={};(s.data||[]).forEach(x=>ST[x.id]=x);setTimeout(list,0);
  return `<input placeholder="Search items…" oninput="q=this.value;list()"><div class="chips">${["All",...Object.keys(CATS)].map(c=>`<button class="chip ${cat===c?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div><div id="list"></div>`;}
function list(){const el=$("list");if(!el)return;const k=q.toLowerCase();
  const a=L.filter(l=>(cat==="All"||l.category===cat)&&(l.title+l.loc+(l.descr||"")).toLowerCase().includes(k));
  el.innerHTML=a.length?`<div class="grid">${a.map(l=>{const s=ST[l.seller_id]||{};return `<div class="card" onclick="view='${l.id}';render()">${thumb(l)}<div class="cb"><div class="t">${esc(l.title)}</div><div class="p">${kes(l.price)}</div><div class="m">${esc(l.loc)} · ${esc(l.cond)}</div><div class="m">${stars(s.avg_stars,s.n_ratings)}${s.sold?` · ${s.sold} sold`:""}</div></div></div>`}).join("")}</div>`:'<div class="empty">No items yet. Check back soon.</div>';}
async function itemView(id){
  const l=L.find(x=>x.id===id);if(!l){view=null;return await browse();}
  const s=ST[l.seller_id]||{};
  const {data:rv}=await sb.from("ratings").select("stars,review,created_at").eq("seller_id",l.seller_id).order("created_at",{ascending:false}).limit(5);
  return `<button class="chip" onclick="view=null;render()">← Back</button>
  <div class="box">${gallery(l)}
  <h2 style="margin:12px 0 2px">${esc(l.title)}</h2><div class="p" style="font-size:22px">${kes(l.price)}</div>
  <div style="margin-top:8px"><span class="tag">${esc(l.category)}</span><span class="tag">${esc(l.cond)}</span><span class="tag">${esc(l.loc)}</span>${l.has_id?'<span class="tag ok">ID on file</span>':""}</div>
  <p>${esc(l.descr)}</p>${termsHtml(l)}
  ${P.role==="buyer"?`<button class="btn" onclick="addCart('${l.id}')">Add to cart</button><button class="btn alt" onclick="buyNow('${l.id}')">Buy now</button>`:""}</div>
  <div class="box"><b>Seller: ${esc(s.name)}${s.verified?" Verified":""}</b><div class="stat" style="font-size:20px">${stars(s.avg_stars,s.n_ratings)}</div>
  <div class="m">${s.sold||0} items sold · Member since ${s.created_at?new Date(s.created_at).toLocaleDateString():""}</div>${mapLine(s.area,s.lat,s.lng)}
  ${(rv||[]).map(r=>`<div class="m" style="margin-top:8px"><span class="gold">${"★".repeat(r.stars)}</span> ${esc(r.review)}</div>`).join("")}</div>
  <div class="box"><button class="btn alt" style="margin-top:0" onclick="togg('ra_box')">Report this ad</button><div id="ra_box" style="display:none">${reportForm("ra",`reportAd('${l.id}')`)}</div><button class="btn alt" onclick="togg('rs_box')">Report this seller</button><div id="rs_box" style="display:none">${reportForm("rs",`reportSeller('${l.seller_id}')`)}</div></div>
  <div class="box"><b>Stay safe</b><div class="tip"><a href="#" onclick="tab='spots';view=null;render();return false" style="color:var(--gr)">Meeting spots near you</a><br>• Meet in a busy public place.<br>• Check the item before you confirm.<br>• Never send money in advance.</div></div>`;}
async function request(id){
  const {error}=await sb.rpc("request_item",{p_listing:id});if(error){toast(error.message);return;}
  toast("Request sent! Track it in My Items.");tab="items";view=null;render();}

/* ---------- seller: post ad, dashboard ---------- */
async function post(){PH=[];const ks=Object.keys(CATS);setTimeout(drawTh,0);return `<h2>Post an item</h2><div class="box"><b>Photos</b><div class="tip">Add 1 to 4 clear photos. Items with good photos sell faster.</div><div class="th" id="th"></div><label class="up">Add photos<input type="file" id="p_files" accept="image/*" multiple onchange="addPhotos(this)"></label></div>
 <label>What are you selling?<input id="p_title"></label>
 <div class="row"><label>Category<select id="p_cat" onchange="$('p_fee').textContent=kes(CATS[this.value])">${ks.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Condition<select id="p_cond"><option>Like new</option><option selected>Good</option><option>Fair</option><option>For parts</option></select></label></div>
 <div class="row"><label>Price (KES)<input id="p_price" type="number" inputmode="numeric"></label><label>Location<input id="p_loc"></label></div>
 <label>IMEI / serial / plate (private, required for phones, electronics, vehicles)<input id="p_serial"></label>
 <label>Details<textarea id="p_desc" rows="3"></textarea></label>
 <div class="box"><b>How you want to sell</b>
 <label>Payment<select id="p_pay"><option value="after">Pay after delivery or meet-up</option><option value="before">Pay before delivery</option><option value="either">Buyer chooses</option></select></label>
 <div class="tip">How can the buyer get it?</div>
 <label class="ck"><input type="checkbox" id="d_meetup" checked> Meet in a public place</label>
 <label class="ck"><input type="checkbox" id="d_pickup"> Buyer collects from me</label>
 <label class="ck"><input type="checkbox" id="d_seller_delivers"> I deliver</label>
 <label class="ck"><input type="checkbox" id="d_courier"> Courier or bus</label>
 <label>Delivery fee if you deliver (KES, optional)<input id="p_dfee" type="number" inputmode="numeric"></label></div>
 <div class="box"><div class="m">Ad fee</div><div class="fee" id="p_fee">${kes(CATS[ks[0]])}</div></div>
 <button class="btn" onclick="savePost()">Publish ad</button>
 <div class="tip">M-Pesa payment for the ad fee is connected in the next step. For now the fee is recorded on your ad.</div>`;}
async function savePost(){
  const g=i=>$(i).value.trim(),c=g("p_cat");
  if(!g("p_title")||!g("p_price")||!g("p_loc")){toast("Fill in title, price and location.");return;}
  if(NEEDID.includes(c)&&!g("p_serial")){toast("Add the IMEI, serial number or plate. It protects buyers.");return;}
  if(!PH.length){toast("Add at least one photo of the item.");return;}
  const dopts=["meetup","pickup","seller_delivers","courier"].filter(k=>$("d_"+k).checked);if(!dopts.length){toast("Choose at least one way the buyer can get the item.");return;}
  let urls=[];toast("Uploading photos…");
  for(let i=0;i<PH.length;i++){const path=U.id+"/"+Date.now()+"_"+i+".jpg";const ur=await sb.storage.from("ad-photos").upload(path,PH[i].b,{contentType:"image/jpeg"});
    if(ur.error){toast("Photo upload failed: "+ur.error.message);return;}urls.push(sb.storage.from("ad-photos").getPublicUrl(path).data.publicUrl);}
  const {error}=await sb.from("listings").insert({seller_id:U.id,title:g("p_title"),category:c,cond:g("p_cond"),price:+g("p_price"),loc:g("p_loc"),serial:g("p_serial")||null,descr:g("p_desc"),fee:CATS[c],photos:urls,pay_terms:g("p_pay"),delivery_opts:dopts,delivery_fee:+g("p_dfee")||0});
  if(error){toast(error.message);return;}
  toast("Your ad is live!");tab="sales";render();}
async function sales(){
  const [st,ad,od]=await Promise.all([sb.from("seller_stats").select("*").eq("id",U.id).single(),
    sb.from("listings").select("*").eq("seller_id",U.id).order("created_at",{ascending:false}),
    sb.from("orders").select("*").eq("seller_id",U.id).order("created_at",{ascending:false})]);
  const s=st.data||{},o=od.data||[],rated=await ratedSet(o);
  BS={};const bid=[...new Set(o.map(x=>x.buyer_id))];if(bid.length){const {data:bs}=await sb.from("buyer_stats").select("*").in("id",bid);(bs||[]).forEach(b=>BS[b.id]=b);}
  return `<h2>My Sales</h2><div class="box"><div class="stat">${stars(s.avg_stars,s.n_ratings)}</div>
  <div class="m">${s.sold||0} items sold · ${o.filter(x=>x.status==="requested").length} new requests</div></div>
  <h3>Orders</h3>${o.length?o.map(x=>orderCard(x,rated)).join(""):'<div class="empty">No requests yet.</div>'}
  <h3>My ads</h3>${(ad.data||[]).map(l=>`<div class="box">${l.photos&&l.photos[0]?`<img class="oth" src="${esc(l.photos[0])}" alt="">`:""}<b>${esc(l.title)}</b> <span class="tag">${esc(l.status)}</span><div class="m">${kes(l.price)} · fee ${kes(l.fee)}</div>${l.status==="live"?`<button class="btn alt" onclick="removeAd('${l.id}')">Remove ad</button>`:""}</div>`).join("")||'<div class="empty">No ads yet.</div>'}`;}
async function removeAd(id){if(!confirm("Remove this ad?"))return;await sb.from("listings").update({status:"removed"}).eq("id",id);render();}

/* ---------- orders (both roles) ---------- */
async function ratedSet(o){if(!o.length)return new Set();
  const {data}=await sb.from(P.role==="seller"?"buyer_ratings":"ratings").select("order_id").in("order_id",o.map(x=>x.id));return new Set((data||[]).map(r=>r.order_id));}
function orderCard(x,rated){
  const sel=P.role==="seller",who=sel?x.buyer_name:x.seller_name,ph=sel?x.buyer_phone:x.seller_phone;
  const wa=`https://wa.me/${esc(ph)}?text=${encodeURIComponent("Hi, about "+x.item_title+" on Pata Deals Hub")}`;
  let act="";
  if(sel&&x.status==="requested")act=`<label>Buyer's national ID number (only the last 3 digits are saved)<input id="i_${x.id}" inputmode="numeric"></label><button class="btn" onclick="markSold('${x.id}')">Mark as sold</button>`;
  else if(!sel&&x.status==="sold")act=`<button class="btn" onclick="received('${x.id}')">I received it and it is OK</button>`;

function compress(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>b?res(b):rej(),"image/jpeg",0.78);URL.revokeObjectURL(img.src);};img.onerror=rej;img.src=URL.createObjectURL(file);});}

function rmCart(id){CART=CART.filter(i=>i!==id);saveCart();render();}
function cartRow(l){const pt=l.pay_terms||"after",dl=l.delivery_opts||["meetup"],po=pt==="either"?["after","before"]:[pt];
  return `<div class="box">${l.photos&&l.photos[0]?`<img class="oth" src="${esc(l.photos[0])}" alt="">`:""}<b>${esc(l.title)}</b><div class="p">${kes(l.price)}</div>
  <label>Payment<select id="cp_${l.id}" onchange="upCart()">${po.map(k=>`<option value="${k}">${PAYL[k]}</option>`).join("")}</select></label>
  <label>Delivery<select id="cd_${l.id}" onchange="upCart()">${dl.map(k=>`<option value="${k}">${DELL[k]||k}${k==="seller_delivers"&&l.delivery_fee?" ("+kes(l.delivery_fee)+")":""}</option>`).join("")}</select></label>
  <button class="btn alt" onclick="rmCart('${l.id}')">Remove</button></div>`;}
function cartTotal(){let it=0,fe=0,adv=false;
  CL.forEach(l=>{it+=l.price;const d=$("cd_"+l.id),p=$("cp_"+l.id);if((d?d.value:(l.delivery_opts||["meetup"])[0])==="seller_delivers")fe+=l.delivery_fee||0;if((p?p.value:(l.pay_terms==="before"?"before":"after"))==="before")adv=true;});
  return `<div class="row"><span>Items (${CL.length})</span><span style="text-align:right">${kes(it)}</span></div>${fe?`<div class="row"><span>Delivery</span><span style="text-align:right">${kes(fe)}</span></div>`:""}<div class="row"><b>Total</b><b style="text-align:right">${kes(it+fe)}</b></div>${adv?'<div class="tip" style="color:var(--warn)">You chose to pay before delivery for some items. Do this only with sellers who have good ratings, and keep your payment message as proof.</div>':""}`;}
function upCart(){const e=$("ct");if(e)e.innerHTML=cartTotal();}
async function cart(){
  const empty=`<h2>Your cart</h2><div class="empty">Your cart is empty.<br><button class="btn" onclick="tab='browse';render()">Browse items</button></div>`;
  if(!CART.length)return empty;
  const {data}=await sb.from("listings_public").select("*").in("id",CART);CL=data||[];
  const gone=CART.filter(i=>!CL.find(x=>x.id===i));if(gone.length){CART=CART.filter(i=>!gone.includes(i));saveCart();}
  if(!CL.length)return empty;setTimeout(upCart,0);
  return `<h2>Your cart</h2>${CL.map(cartRow).join("")}<div class="box" id="ct"></div>
  <div class="box"><b>Where to meet or receive</b><div class="tip">Pick a busy public place. <a href="#" onclick="tab='spots';view=null;render();return false" style="color:var(--gr)">See meeting spots</a></div>
  <label>Place or area<input id="c_place" placeholder="For example: Thika Road Mall, main entrance"></label><label>Note to the seller (optional)<input id="c_note"></label></div>
  <button class="btn" onclick="checkout()">Place order</button><div class="tip">You pay each seller directly, the way you agreed. The app does not hold your money.</div>`;}
async function checkout(){const place=$("c_place").value.trim(),note=$("c_note").value.trim();
  if(place.length<3){toast("Enter where you want to meet or receive the items.");return;}
  let done=0,fail=[];
  for(const l of CL){const {error}=await sb.rpc("place_order",{p_listing:l.id,p_pay:$("cp_"+l.id).value,p_delivery:$("cd_"+l.id).value,p_place:place,p_note:note});
    if(error)fail.push(error.message);else{done++;CART=CART.filter(i=>i!==l.id);}}
  saveCart();toast(fail.length?fail[0]:"Order placed. Track it in My Items.");
  if(done){tab="items";view=null;render();}else render();}

/* ---------- check an item ---------- */
async function check(){return `<h2>Check an item</h2><div class="tip">Buying a used phone? Type its IMEI, serial or plate to see if it was sold on Pata Deals Hub before.</div>
 <label>IMEI / serial / plate<input id="c_in"></label><button class="btn" onclick="doCheck()">Check</button><div id="c_out"></div><div class="box"><b>Report a stolen item</b><div class="tip">If your phone, laptop or another item was stolen, add its IMEI or serial number. Matching ads are hidden straight away while we check.</div><label>IMEI / serial / plate<input id="st_s"></label><label>What happened? (optional)<input id="st_d"></label><button class="btn" onclick="reportStolen()">Report stolen item</button></div>`;}
async function doCheck(){
  const v=$("c_in").value.trim();if(!v)return;
  const {data,error}=await sb.rpc("check_serial",{p_serial:v}),o=$("c_out");
  if(error){o.innerHTML=`<div class="box">${esc(error.message)}</div>`;return;}
  if(data.stolen){o.innerHTML='<div class="box"><div class="fee">REPORTED STOLEN. Do not buy.</div></div>';return;}
  o.innerHTML=data.sales?`<div class="box"><span class="tag ok">Record found</span><div class="m">Sold ${data.sales} time(s). Last sale: ${new Date(data.last).toLocaleDateString()}.</div></div>`
   :`<div class="box">No record on Pata Deals Hub. That does not prove it is safe. Ask the seller for proof of purchase.</div>`;}
init();
</script>
</body>
</html>
